[project]
name = "cnu-ai-agent"
version = "0.0.1"
description = "Browser-use + Qwen2.5-VL behavioral cloning agent for CNU KORUS (teacher-student pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"browser-use>=0.2.0",
	"claude-agent-sdk>=0.1.0",
	"pydantic>=2.0",
	"uuid7>=0.1.0",
	"pillow>=10.0",
]

[project.optional-dependencies]
training = [
	"torch>=2.4",
	"transformers>=4.46",
	"trl>=0.12",
	"peft>=0.13",
	"accelerate>=1.0",
	"datasets>=3.0",
	"bitsandbytes>=0.44",
]
serve = [
	"vllm>=0.6.0",
]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"ruff>=0.6",
	"pyright>=1.1",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/cnu_agent/__init__.py would collide with the real cnu_agent package
# under the default "prepend" import mode, so use importlib + an explicit
# pythonpath rooted at the project so `from cnu_agent...` resolves to source.
pythonpath = ["."]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnu_agent"]
